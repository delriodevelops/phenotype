<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibración PSL</title>
<style>
  :root { --bg: #f3efe7; --ink: #2b241c; --muted: #7a6f62; --gold: #b08d4a; --line: #d9cfbf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 Georgia, 'Times New Roman', serif; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(560px, 100% - 32px); text-align: center; padding: 24px 0; }
  h1 { font-weight: 400; letter-spacing: .3em; font-size: 14px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .frame { aspect-ratio: 1; width: min(420px, 100%); margin: 0 auto 16px; background: #222; border: 6px solid var(--gold); display: grid; place-items: center; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: contain; }
  .tiers { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
  .tiers button { font: inherit; font-size: 13px; padding: 10px 2px; border: 1px solid var(--line); background: #fffaf2; color: var(--ink); cursor: pointer; }
  .tiers button:hover, .tiers button:focus-visible { border-color: var(--gold); outline: none; background: #fff; }
  .tiers button small { display: block; color: var(--muted); font-size: 11px; }
  .row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
  .row button { font: inherit; font-size: 14px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .bar { height: 3px; background: var(--line); margin: 12px 0; } .bar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }
  .done { display: none; } body.finished .done { display: block; } body.finished .work { display: none; }
  @media (max-width: 480px) { .tiers { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>CALIBRACIÓN PSL</h1>
  <p class="sub">Pon a cada cara el tier que le darías tú. Mira solo la cara: ignora la foto, la luz y la ropa. Teclas 1–7.</p>
  <div class="work">
    <div class="frame"><img id="face" alt="Cara a puntuar"></div>
    <div class="tiers" id="tiers"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="row"><button id="undo" type="button">← Deshacer</button><span id="count"></span><button id="skip" type="button">Saltar (S)</button></div>
  </div>
  <div class="done"><p>Hecho. Ya puedes volver al chat.</p></div>
</main>
<script>
const TIERS = [['Sub-5', 3.0], ['LTN', 3.9], ['MTN', 4.6], ['HTN', 5.4], ['Chadlite', 6.1], ['Chad', 7.0], ['True Adam', 7.8]];
let GOAL = 150;
let list = [], i = 0, history = [], rated = 0;
const $ = (id) => document.getElementById(id);
TIERS.forEach(([name, psl], k) => {
  const b = document.createElement('button'); b.type = 'button'; b.innerHTML = `${name}<small>${k + 1}</small>`;
  b.onclick = () => rate(name, psl); $('tiers').append(b);
});
async function rate(tier, psl) {
  const it = list[i]; if (!it) return;
  await fetch('/rate', { method: 'POST', body: JSON.stringify({ id: it.id, tier, psl, t: Date.now() }) });
  history.push(i); rated++; next();
}
function skip() { history.push(i); next(); }
function next() { i++; show(); }
async function undo() {
  if (!history.length) return;
  i = history.pop();
  const r = await fetch('/unrate', { method: 'POST', body: JSON.stringify({ id: list[i].id }) }); if ((await r.text()) === 'removed') rated--;
  show();
}
function show() {
  $('count').textContent = `${rated} / ${GOAL}`;
  $('bar').style.width = Math.min(100, (rated / GOAL) * 100) + '%';
  if (i >= list.length) { document.body.classList.add('finished'); return; }
  document.body.classList.remove('finished');
  $('face').src = '/' + list[i].id;
  const nx = list[i + 1]; if (nx) new Image().src = '/' + nx.id;
}
addEventListener('keydown', (e) => {
  const n = Number(e.key); if (n >= 1 && n <= 7) rate(...TIERS[n - 1]);
  else if (e.key === 's' || e.key === 'S') skip();
  else if (e.key === 'Backspace' || e.key === 'ArrowLeft') undo();
});
$('skip').onclick = skip; $('undo').onclick = undo;
(async () => {
  const all = await (await fetch('/rate-list')).json();
  const done = new Set(await (await fetch('/rated')).json());
  GOAL = all.length; rated = done.size; list = all.filter((x) => !done.has(x.id)); show();
})();
</script>
</body>
</html>
